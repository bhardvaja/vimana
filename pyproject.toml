[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vimana"
version = "1.0.0"
description = "The Bharadvaja Vimana: the axis of convergence, as runnable code"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ram Bhāradvāja" }]
keywords = ["order of convergence", "iterative methods", "split-complex",
            "arithmetic-geometric mean", "Chebyshev", "modular equation",
            "mula-bheda", "Brahmagupta"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = ["mpmath>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7", "sympy>=1.12"]

[project.urls]
Repository = "https://github.com/bhardvaja/vimana"
Paper = "https://doi.org/10.5281/zenodo.22027073"
"Predecessor paper" = "https://doi.org/10.5281/zenodo.20044554"

[tool.setuptools.packages.find]
include = ["vimana*"]
